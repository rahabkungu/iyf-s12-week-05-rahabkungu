<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wek 5 DOM challenges</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!--Day 1: color changer-->
    <section>
        <h2>Day 1: color changer</h2>
        <h3>Sub heading Example</h3>
        <button id="colorBtn">Change Headings Color</button>
    </section>
    <hr>

    <!--Day 2: Dynamic Element Creator-->
    <section>
        <h2>Day 2: Dynamic Element Creator</h2>
        <button id="addParaBtn">Add paragraph</button>
        <div id="container"></div>
    </section>

    <!--Day 3: Image Remover-->
    <section>
        <h2>Day 3: Image Remover</h2>
        <button id="toggleImgBtn">Hide Images</button>
        <br>
        <img src="https://via.placeholder.com/150" alt="placeholder Image">
    </section>

    <!--Content Copier-->
    <section>
        <h2>Day 4: Content Copier</h2>
        <div id="source" contenteditable="true" style="border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;">
            Type some content here to copy it over!
        </div>
        <button id ="copyBtn">Copy Content</button>
        <div id ="target" styles="border:1px dashed #ccc; padding:10px; margin-top:10px;">
            Target area (content will appear here)
        </div>
    </section>

    <!--Day 5: Dark Mode Toggle Button-->
    <h2>Day 5: Dark mode toggle button</h2>
    <button id ="darkModeBtn">Toggle Dark Mode</button>

    <script src="js/script.js"></script>
</body>
</html>
